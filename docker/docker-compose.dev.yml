name: ghostfolio_dev
services:
  ghostfolio:
    extends:
      file: docker-compose.yml
      service: ghostfolio
    container_name: ghostfolio-dev
    ports:
      - ${GHOSTFOLIO_PORT:-3333}:3333
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    container_name: gf-postgres-dev
    ports:
      - ${POSTGRES_PORT:-5432}:5432

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    container_name: gf-redis-dev
    ports:
      - ${REDIS_PORT:-6379}:6379

volumes:
  postgres:
